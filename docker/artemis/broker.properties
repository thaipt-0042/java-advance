# Apache Artemis (formerly ActiveMQ Artemis) settings applied on top of the image's broker.xml. Used by
# docker-compose.yml and by the tests (TestcontainersConfiguration), so both behave the same.

# Queue of the statistics refresh messages, and its dead letter queue. Declared here so they exist (and keep their
# messages) even while no application instance is connected.
addressConfigurations."analytics.stats-refresh".routingTypes=ANYCAST
addressConfigurations."analytics.stats-refresh".queueConfigs."analytics.stats-refresh".routingType=ANYCAST
addressConfigurations."analytics.stats-refresh.dlq".routingTypes=ANYCAST
addressConfigurations."analytics.stats-refresh.dlq".queueConfigs."analytics.stats-refresh.dlq".routingType=ANYCAST

# A message whose processing fails (the listener throws, the transaction rolls back) is delivered again after 1s,
# 2s, 4s; after 4 failed deliveries it moves to the dead letter queue.
addressSettings."analytics.stats-refresh".maxDeliveryAttempts=4
addressSettings."analytics.stats-refresh".redeliveryDelay=1000
addressSettings."analytics.stats-refresh".redeliveryMultiplier=2
addressSettings."analytics.stats-refresh".deadLetterAddress=analytics.stats-refresh.dlq
