# The datasource comes from TestcontainersConfiguration (@ServiceConnection, real MySQL 8.4)

# Demo form login, used by the tests that log in through a real server
app.demo-login.enabled=true
app.demo-login.admin-password=test-admin-password
app.demo-login.user-password=test-user-password

# The schedule is off (tests start runs themselves); mock APIs answer at once and never fail
app.metrics-job.cron=-
app.metrics-job.mock.delay=0s
