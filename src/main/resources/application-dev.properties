# Local development only (also enables DataSeeder)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Swagger UI sends the XSRF-TOKEN cookie back in the X-XSRF-TOKEN header (CSRF is on for the API)
springdoc.swagger-ui.csrf.enabled=true

# Demo accounts demo-admin (ADMIN) and demo-user (USER); the app refuses to start without the passwords
app.demo-login.enabled=true
app.demo-login.admin-password=${APP_DEMO_ADMIN_PASSWORD:}
app.demo-login.user-password=${APP_DEMO_USER_PASSWORD:}

logging.level.com.sunasterisk.socialanalytics=DEBUG
