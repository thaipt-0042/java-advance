spring.application.name=social-analytics
# Read local overrides from .env (copy from .env.example); also used by docker compose
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

server.port=${PORT:8080}

# ===== Datasource (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:social_analytics}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# No default credentials: the app fails to start if they are not set (locally they come from .env)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# Never let Hibernate change the schema outside dev; the dev profile switches to "update"
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== OpenAPI / Swagger: disabled by default, enabled in the dev profile =====
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Actuator =====
management.endpoints.web.exposure.include=health

# ===== Logging (see logback-spring.xml) =====
logging.level.root=INFO
logging.level.com.sunasterisk.socialanalytics=INFO
logging.file.name=${LOG_FILE:logs/social-analytics.log}
