spring.application.name=social-analytics
# Read local overrides from .env (copy from .env.example); also used by docker compose
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

server.port=${PORT:8080}
# Behind a reverse proxy / load balancer that terminates HTTPS, set FORWARD_HEADERS_STRATEGY=native so links built
# from the request (e.g. the Location header) use the public scheme and host from X-Forwarded-*. Empty: Boot decides
# (on for cloud platforms it detects, off otherwise).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:}

# ===== Datasource (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:social_analytics}?serverTimezone=UTC
# No default credentials: the app fails to start if they are not set (locally they come from .env)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Schema: Flyway migrations in db/migration; Hibernate only validates =====
spring.flyway.fail-on-missing-locations=true

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Business time zone (Clock bean; "today", date filters, report dates) =====
app.time-zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

# ===== OpenAPI / Swagger: disabled by default, enabled in the dev profile =====
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Actuator =====
management.endpoints.web.exposure.include=health

# ===== Logging (see logback-spring.xml) =====
logging.level.root=INFO
logging.level.com.sunasterisk.socialanalytics=INFO
logging.file.name=${LOG_FILE:logs/social-analytics.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
