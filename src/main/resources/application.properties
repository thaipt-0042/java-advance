spring.application.name=social-analytics
# Read local overrides from .env (copy from .env.example); also used by docker compose
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

server.port=${PORT:8080}
# Behind a reverse proxy / load balancer that terminates HTTPS, set FORWARD_HEADERS_STRATEGY=native so links built
# from the request (e.g. the Location header) use the public scheme and host from X-Forwarded-*. Empty: Boot decides
# (on for cloud platforms it detects, off otherwise).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:}

# ===== Upload (Excel import) =====
spring.servlet.multipart.max-file-size=5MB
# Room for the multipart headers around a 5MB file
spring.servlet.multipart.max-request-size=6MB
# Tomcat reads (and drops) at most this much of a rejected body before replying; above it the connection is reset
# and the client gets no 413. Default 2MB, below the upload limit.
server.tomcat.max-swallow-size=50MB

# ===== Demo form login (docs/cau-hoi-lam-ro.md Q2): enabled in the dev profile only =====
app.demo-login.enabled=false

# ===== Datasource (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:social_analytics}?serverTimezone=UTC
# No default credentials: the app fails to start if they are not set (locally they come from .env)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JDBC batches become multi-row INSERTs (Excel import); set on the pool so it also applies to the test database
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# ===== Schema: Flyway migrations in db/migration; Hibernate only validates =====
spring.flyway.fail-on-missing-locations=true

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Business time zone (Clock bean; "today", date filters, report dates) =====
app.time-zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

# ===== Metrics job (docs/03-kien-truc.md section 4); checked at startup =====
# Spring cron (6 fields) in app.time-zone; "-" turns the schedule off
app.metrics-job.cron=${METRICS_JOB_CRON:0 0 * * * *}
# Accounts updated in parallel; max-size must stay below the database pool (Hikari, 10 by default)
app.metrics-job.pool.core-size=${METRICS_JOB_THREADS:4}
app.metrics-job.pool.max-size=${METRICS_JOB_THREADS:4}
app.metrics-job.pool.queue-capacity=1000
# A run waits this long for its accounts; the lock outlives it in case the instance dies mid-run
app.metrics-job.account-timeout=PT5M
app.metrics-job.lock-at-most-for=PT10M
# Mock Facebook / X APIs: delay of each call and share of calls that fail
app.metrics-job.mock.delay=PT0.2S
app.metrics-job.mock.failure-rate=0

# ===== OpenAPI / Swagger: disabled by default, enabled in the dev profile =====
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Actuator =====
management.endpoints.web.exposure.include=health

# ===== Logging (see logback-spring.xml) =====
logging.level.root=INFO
logging.level.com.sunasterisk.socialanalytics=INFO
logging.file.name=${LOG_FILE:logs/social-analytics.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
