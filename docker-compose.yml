services:
  mysql:
    image: mysql:8.4
    container_name: social-analytics-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-social_analytics}
      MYSQL_USER: ${DB_USERNAME:-social}
      MYSQL_PASSWORD: ${DB_PASSWORD:-social}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # JMS broker (Apache Artemis, formerly ActiveMQ Artemis). Same version as the client managed by Spring Boot.
  # Queues, redelivery and dead letter queue: docker/artemis/broker.properties (copied over the image's settings).
  artemis:
    image: apache/artemis:2.53.0
    container_name: social-analytics-artemis
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-artemis}
    ports:
      - "${ARTEMIS_PORT:-61616}:61616"
    volumes:
      - ./docker/artemis/broker.properties:/var/lib/artemis-instance/etc-override/broker.properties:ro
      - artemis-data:/var/lib/artemis-instance/data

volumes:
  mysql-data:
  artemis-data:
