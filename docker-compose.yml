services:
  mysql:
    image: mysql:8.4
    container_name: social-analytics-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-social_analytics}
      MYSQL_USER: ${DB_USERNAME:-social}
      MYSQL_PASSWORD: ${DB_PASSWORD:-social}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
