name: CI

on:
  push:
    branches: [main]
  # Mọi base branch: các PR đang xếp chồng (base là nhánh feature) cũng chạy CI.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Chỉ hủy lượt cũ của cùng một PR; lượt chạy trên main luôn chạy hết.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          # Từ v6.3.0 phải bật tay để lỗi biên dịch hiện thành annotation trên diff.
          problem-matcher: true
      # Testcontainers dùng Docker có sẵn trên runner.
      - run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
